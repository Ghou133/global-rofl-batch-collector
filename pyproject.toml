[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "global-rofl-batch-collector"
version = "2.0.0"
description = "Global-region high-elo ROFL batch collector with Tencent CN replay capture"
readme = "README.md"
license = {text = "AGPL-3.0-only"}
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "anyio>=4.9,<5",
  "click>=8.1,<9",
  "httpx2[http2,brotli,zstd]>=0.1.0",
  "pydantic>=2.10,<3",
  "rich>=13.9,<16",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "ruff>=0.9",
]

[project.scripts]
collector = "global_rofl_collector.entrypoint:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lol_collector = ["schema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Preserve the migrated CN source's established style and Typer option signatures.
"src/lol_collector/*.py" = ["E501", "I001", "B008", "UP017"]
